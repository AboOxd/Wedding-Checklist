<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝓞𝓾𝓻 𝓦𝓮𝓭𝓭𝓲𝓷𝓰 𝓣𝓸-𝓓𝓸-𝓛𝓲𝓼𝓽</title>
<style>
  :root {
    --sage: #d98ca3;
    --sage-dark: #c06d87;
    --cream: #fff5f7;
    --line: #f3d4dd;
    --ink: #4a3540;
    --muted: #b3899a;
    --pink-soft: #ffe8ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Georgia', 'Iowan Old Style', serif;
    background:
      radial-gradient(circle at 8% 12%, #ffdce6 0%, transparent 22%),
      radial-gradient(circle at 92% 18%, #ffe3ec 0%, transparent 24%),
      radial-gradient(circle at 15% 92%, #ffe3ec 0%, transparent 24%),
      radial-gradient(circle at 88% 88%, #ffdce6 0%, transparent 22%),
      var(--cream);
    color: var(--ink);
    min-height: 100vh;
    padding: 24px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 28px;
    position: relative;
  }
  header::before {
    content: "❀ ⋆ ❀";
    display: block;
    color: var(--sage);
    font-size: 16px;
    letter-spacing: 6px;
    margin-bottom: 8px;
    opacity: 0.8;
  }
  header h1 {
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.5px;
    margin: 0 0 6px;
    color: var(--sage-dark);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  header::after {
    content: "🌸 ⋆ 🌸";
    display: block;
    font-size: 14px;
    letter-spacing: 6px;
    margin-top: 8px;
    opacity: 0.85;
  }
  .progress-bar {
    height: 6px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    margin: 16px 0;
  }
  .progress-fill {
    height: 100%;
    background: var(--sage);
    transition: width 0.3s ease;
  }
  .progress-label {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .section-label {
    font-family: -apple-system, sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin: 18px 2px 8px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .add-row input, .add-row select {
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: white;
  }
  .add-row input[type="text"] { flex: 1; min-width: 120px; }
  .add-row button {
    background: linear-gradient(135deg, var(--sage), var(--sage-dark));
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-family: -apple-system, sans-serif;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(192, 109, 135, 0.35);
    white-space: nowrap;
  }
  .add-row button:active { background: var(--sage-dark); }
  .add-row.category-row { margin-bottom: 24px; }
  .category {
    margin-bottom: 22px;
  }
  .category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 8px 2px;
  }
  .category-title {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--sage-dark);
    cursor: pointer;
  }
  .category-title::before { content: "✿ "; }
  .category-actions button {
    background: none;
    border: none;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    cursor: pointer;
    padding: 2px 5px;
  }
  .category-actions button:hover { color: var(--sage-dark); }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: linear-gradient(135deg, #ffffff, var(--pink-soft));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 12px;
    margin-bottom: 8px;
    box-shadow: 0 2px 8px rgba(217, 140, 163, 0.12);
  }
  .item.done { opacity: 0.55; }
  .item input[type="checkbox"] {
    margin-top: 3px;
    width: 18px;
    height: 18px;
    accent-color: var(--sage);
    flex-shrink: 0;
  }
  .item .text {
    flex: 1;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
  }
  .item.done .text { text-decoration: line-through; }
  .item .who {
    font-family: -apple-system, sans-serif;
    font-size: 10px;
    color: var(--muted);
    margin-top: 3px;
  }
  .item .del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 4px;
    flex-shrink: 0;
  }
  .empty {
    text-align: center;
    color: var(--muted);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    padding: 30px 0;
  }
  .who-select {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    text-align: center;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .who-select select {
    font-family: -apple-system, sans-serif;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 6px;
    background: white;
  }
  .status-msg {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    text-align: center;
    margin-top: 4px;
    padding: 4px 10px;
    border-radius: 12px;
  }
  .status-msg.saving { color: var(--sage-dark); background: var(--pink-soft); }
  .status-msg.saved { color: #2d7a4a; background: #e6f5ed; }
  .status-msg.error { color: #c0392b; background: #fde8e5; }
  .status-msg.synced { color: #2d7a4a; background: #e6f5ed; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>𝓞𝓾𝓻 𝓦𝓮𝓭𝓭𝓲𝓷𝓰 𝓣𝓸-𝓓𝓸-𝓛𝓲𝓼𝓽</h1>
  </header>

  <div class="who-select">
    I am:
    <select id="whoSelect"></select>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 of 0 done</div>
  <div class="status-msg" id="statusMsg">Loading...</div>

  <div class="section-label">Add a category</div>
  <div class="add-row category-row">
    <input type="text" id="newCategoryInput" placeholder="e.g. Honeymoon, Rings..." />
    <button id="addCategoryBtn">+ Category</button>
  </div>

  <div class="section-label">Add a task</div>
  <div class="add-row">
    <input type="text" id="newItem" placeholder="Add a task..." />
    <select id="newCategory"></select>
    <button id="addBtn">Add</button>
  </div>

  <div id="list"></div>
</div>

<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
//  🔑 YOUR SUPABASE DETAILS
// ============================================================

const SUPABASE_URL = 'https://jejkssldcqfxkwoaqdfr.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Implamtzc2xkY3FmeGt3b2FxZGZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTIzNTUsImV4cCI6MjEwMzE2ODM1NX0.DrsNBv5T247gg-VdRDAjeN1tMa5LBKljD3ig-MFlsHc';

// ============================================================
//  SUPABASE CLIENT WITH EXPLICIT HEADERS
//  NOTE: renamed to supabaseClient — the loaded library already
//  defines a global called "supabase", so reusing that name for
//  our own const crashed the whole script (SyntaxError).
// ============================================================

// Create a custom fetch that includes the API key in headers
const customFetch = async (url, options = {}) => {
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${SUPABASE_KEY}`,
    'Content-Type': 'application/json',
    'Accept': 'application/json',
    ...options.headers
  };

  const response = await fetch(url, {
    ...options,
    headers
  });

  return response;
};

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  global: {
    fetch: customFetch
  }
});

// ============================================================
//  APP STATE
// ============================================================

let items = [];
let categories = [];
let currentUser = '';
let isSaving = false;

const listEl = document.getElementById('list');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const statusMsg = document.getElementById('statusMsg');
const whoSelect = document.getElementById('whoSelect');
const newCategory = document.getElementById('newCategory');
const newItem = document.getElementById('newItem');
const addBtn = document.getElementById('addBtn');
const newCategoryInput = document.getElementById('newCategoryInput');
const addCategoryBtn = document.getElementById('addCategoryBtn');

const DEFAULT_CATEGORIES = ['Venue & Date', 'Guests & Invites', 'Attire', 'Food & Drink', 'Vendors', 'Ceremony', 'Other'];

const DEFAULT_ITEMS = [
  { id: 't1', text: 'Set the wedding date', category: 'Venue & Date', done: false, who: '' },
  { id: 't2', text: 'Book the venue', category: 'Venue & Date', done: false, who: '' },
  { id: 't3', text: 'Draft the guest list', category: 'Guests & Invites', done: false, who: '' },
  { id: 't4', text: 'Send save-the-dates', category: 'Guests & Invites', done: false, who: '' },
  { id: 't5', text: 'Choose the dress', category: 'Attire', done: false, who: '' },
  { id: 't6', text: 'Choose the suit', category: 'Attire', done: false, who: '' },
  { id: 't7', text: 'Book caterer', category: 'Food & Drink', done: false, who: '' },
  { id: 't8', text: 'Order the cake', category: 'Food & Drink', done: false, who: '' },
  { id: 't9', text: 'Book photographer', category: 'Vendors', done: false, who: '' },
  { id: 't10', text: 'Book florist', category: 'Vendors', done: false, who: '' },
];

function setStatus(msg, type = '') {
  statusMsg.textContent = msg;
  statusMsg.className = 'status-msg' + (type ? ` ${type}` : '');
}

function populateWho() {
  whoSelect.innerHTML = '<option value="">Choose...</option><option value="Za3bolio">Za3bolio</option><option value="Mariomaaa">Mariomaaa</option>';
}
populateWho();

function populateCategorySelect() {
  const current = newCategory.value;
  newCategory.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  newCategory.value = current;
}

whoSelect.addEventListener('change', () => {
  currentUser = whoSelect.value;
  localStorage.setItem('wedding-who', currentUser);
});

// ============================================================
//  SUPABASE — LOAD DATA (with explicit headers)
// ============================================================

async function loadFromSupabase() {
  try {
    setStatus('Loading from cloud...', 'saving');
    console.log('📤 Fetching tasks from Supabase...');

    const { data, error } = await supabaseClient
      .from('tasks')
      .select('*')
      .order('id', { ascending: true });

    if (error) {
      console.error('❌ Load error:', error);
      setStatus('⚠️ Error: ' + error.message, 'error');
      return false;
    }

    console.log('✅ Data received:', data);

    const saved = localStorage.getItem('wedding-checklist-categories');
    if (saved) {
      try { categories = JSON.parse(saved); } catch(e) { categories = DEFAULT_CATEGORIES; }
    } else {
      categories = DEFAULT_CATEGORIES;
    }

    // If no data exists, create default tasks
    if (!data || data.length === 0) {
      setStatus('📝 Creating default tasks...', 'saving');
      console.log('📝 No tasks found. Creating defaults...');

      const { error: insertError } = await supabaseClient
        .from('tasks')
        .insert(DEFAULT_ITEMS);

      if (insertError) {
        console.error('❌ Insert error:', insertError);
        setStatus('⚠️ Could not create tasks: ' + insertError.message, 'error');
        setTimeout(() => loadFromSupabase(), 3000);
        return false;
      }

      console.log('✅ Default tasks created! Reloading...');
      setStatus('✅ Default tasks created!', 'saved');

      setTimeout(() => loadFromSupabase(), 500);
      return true;
    }

    // Data exists - use it
    items = data;
    currentUser = localStorage.getItem('wedding-who') || '';
    whoSelect.value = currentUser;

    populateCategorySelect();
    render();
    setStatus('✅ Connected & synced live', 'saved');
    return true;
  } catch (e) {
    console.error('❌ Load failed:', e);
    setStatus('⚠️ Load failed: ' + e.message, 'error');
    return false;
  }
}

// ============================================================
//  SUPABASE — SAVE DATA
// ============================================================

async function saveToSupabase(taskList) {
  try {
    isSaving = true;
    setStatus('💾 Saving...', 'saving');

    const { error: deleteError } = await supabaseClient
      .from('tasks')
      .delete()
      .neq('id', '');

    if (deleteError) throw deleteError;

    if (taskList.length > 0) {
      const { error: insertError } = await supabaseClient
        .from('tasks')
        .insert(taskList);

      if (insertError) throw insertError;
    }

    setStatus('✅ Saved to cloud', 'saved');
    return true;
  } catch (e) {
    console.error('❌ Save failed:', e);
    setStatus('⚠️ Save failed: ' + e.message, 'error');
    return false;
  } finally {
    isSaving = false;
  }
}

function scheduleSave() {
  if (isSaving) return;
  if (window._saveTimeout) clearTimeout(window._saveTimeout);
  window._saveTimeout = setTimeout(() => {
    saveToSupabase(items);
  }, 1000);
}

// ============================================================
//  SUPABASE — REAL-TIME SYNC
// ============================================================

function setupRealtime() {
  const channel = supabaseClient.channel('tasks-realtime')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'tasks'
      },
      (payload) => {
        if (isSaving) return;
        console.log('🔄 Realtime update:', payload);
        loadFromSupabase();
      }
    )
    .subscribe((status) => {
      console.log('📡 Realtime status:', status);
      if (status === 'SUBSCRIBED') {
        setStatus('✅ Live sync active', 'saved');
      }
    });

  return channel;
}

// ============================================================
//  RENDER
// ============================================================

function render() {
  const total = items.length;
  const done = items.filter(i => i.done).length;
  progressFill.style.width = total ? `${(done/total)*100}%` : '0%';
  progressLabel.textContent = `${done} of ${total} done`;

  listEl.innerHTML = '';
  if (categories.length === 0) {
    listEl.innerHTML = '<div class="empty">🌷 No categories yet — add one above.</div>';
    return;
  }

  categories.forEach(cat => {
    const catItems = items.filter(i => i.category === cat);
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    catDiv.innerHTML = `
      <div class="category-header">
        <div class="category-title" data-cat="${escapeHtml(cat)}" title="Click to rename">${escapeHtml(cat)}</div>
        <div class="category-actions">
          <button class="rename-cat" data-cat="${escapeHtml(cat)}" title="Rename category">✎</button>
          <button class="del-cat" data-cat="${escapeHtml(cat)}" title="Delete category">🗑</button>
        </div>
      </div>
    `;
    if (catItems.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.style.padding = '10px 0';
      empty.textContent = 'No tasks in this category yet.';
      catDiv.appendChild(empty);
    }
    catItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'item' + (item.done ? ' done' : '');
      div.innerHTML = `
        <input type="checkbox" ${item.done ? 'checked' : ''} data-id="${escapeHtml(item.id)}" class="chk" />
        <div class="text">${escapeHtml(item.text)}${item.who ? `<div class="who">${item.done ? 'Done' : 'Added'} by ${escapeHtml(item.who)}</div>` : ''}</div>
        <button class="del" data-id="${escapeHtml(item.id)}">&times;</button>
      `;
      catDiv.appendChild(div);
    });
    listEl.appendChild(catDiv);
  });

  document.querySelectorAll('.chk').forEach(chk => {
    chk.addEventListener('change', (e) => {
      const id = e.target.getAttribute('data-id');
      const item = items.find(i => i.id === id);
      if (item) {
        item.done = e.target.checked;
        if (item.done && currentUser) item.who = currentUser;
        render();
        scheduleSave();
      }
    });
  });

  document.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const id = e.target.getAttribute('data-id');
      items = items.filter(i => i.id !== id);
      render();
      scheduleSave();
    });
  });

  document.querySelectorAll('.rename-cat, .category-title').forEach(el => {
    el.addEventListener('click', (e) => {
      const oldName = e.currentTarget.getAttribute('data-cat');
      const newName = prompt('Rename category:', oldName);
      if (!newName || !newName.trim() || newName.trim() === oldName) return;
      const trimmed = newName.trim();
      if (categories.includes(trimmed)) {
        alert('A category with that name already exists.');
        return;
      }
      categories = categories.map(c => c === oldName ? trimmed : c);
      items.forEach(i => { if (i.category === oldName) i.category = trimmed; });
      localStorage.setItem('wedding-checklist-categories', JSON.stringify(categories));
      populateCategorySelect();
      render();
      scheduleSave();
    });
  });

  document.querySelectorAll('.del-cat').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const cat = e.target.getAttribute('data-cat');
      const hasItems = items.some(i => i.category === cat);
      const msg = hasItems
        ? `Delete "${cat}" and all its tasks?`
        : `Delete "${cat}"?`;
      if (!confirm(msg)) return;
      categories = categories.filter(c => c !== cat);
      items = items.filter(i => i.category !== cat);
      localStorage.setItem('wedding-checklist-categories', JSON.stringify(categories));
      populateCategorySelect();
      render();
      scheduleSave();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
//  EVENT LISTENERS
// ============================================================

addBtn.addEventListener('click', () => {
  const text = newItem.value.trim();
  if (!text) return;
  if (categories.length === 0) {
    alert('Add a category first.');
    return;
  }
  items.push({
    id: 't' + Date.now(),
    text,
    category: newCategory.value,
    done: false,
    who: currentUser
  });
  newItem.value = '';
  render();
  scheduleSave();
});

newItem.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addBtn.click();
});

addCategoryBtn.addEventListener('click', () => {
  const name = newCategoryInput.value.trim();
  if (!name) return;
  if (categories.includes(name)) {
    alert('That category already exists.');
    return;
  }
  categories.push(name);
  newCategoryInput.value = '';
  localStorage.setItem('wedding-checklist-categories', JSON.stringify(categories));
  populateCategorySelect();
  newCategory.value = name;
  render();
  scheduleSave();
});

newCategoryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addCategoryBtn.click();
});

// ============================================================
//  START THE APP
// ============================================================

async function init() {
  await loadFromSupabase();
  setupRealtime();
}

init();
</script>
</body>
</html>
